bio: |
  I am a researcher and lecturer working at the intersection of **cybersecurity,
  machine learning and large-scale Internet systems**. My research asks how we
  can detect malicious and automated activity on the web reliably, efficiently
  and with respect for user privacy — and how to measure what web platforms and
  AI models actually do in the wild.

  I co-founded **Protected Media**, an ad-fraud and bot-detection company that
  was acquired by Flashtalking (now Mediaocean) in 2021, and served as its CTO,
  leading machine-learning systems that process tens of billions of requests per
  day. Earlier I co-founded a2z Technologies (IP acquired) and was **Chief
  Scientist at Cyren**, where I led research on anti-spam,
  phishing, botnets and text classification.

  I hold a **Ph.D. in Information Systems**, an MBA and a **B.Sc. in Computer
  Science**, all from Bar-Ilan University. Since 2016 I have taught
  entrepreneurship and innovation workshops at Bar-Ilan's Graduate School of
  Business Administration (EMBA, IMBA and MBA programs).
